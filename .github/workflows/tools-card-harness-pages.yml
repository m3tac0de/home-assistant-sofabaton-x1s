name: tools-card harness Pages

on:
  push:
    branches: [main]
    paths:
      - "custom_components/sofabaton_x1s/www/src/**"
      - "custom_components/sofabaton_x1s/www/tools-card.js"
      - "custom_components/sofabaton_x1s/www/tools-card-locales/**"
      - "tests/tools-card-harness.html"
      - "scripts/build-tools-card.mjs"
      - "scripts/build-tools-card-harness-site.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tools-card-harness-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tools-card-harness-pages
  cancel-in-progress: false

jobs:
  build:
    name: build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:tools-card
      - name: Build harness site
        run: npm run build:tools-card-harness-site
        env:
          HARNESS_ASSET_VERSION: ${{ github.sha }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/tools-card-harness-site

  deploy:
    name: deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
