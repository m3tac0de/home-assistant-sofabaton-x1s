# Packaging metadata for "sofabaton-x-server": a hub management application
# with a web remote and local API over the sofabaton-x library. Second distribution
# (docs/internal/sofabaton-x-server-plan.md, decision 7); the library is
# the only thing it knows about hubs.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sofabaton-x-server"
dynamic = ["version"]
description = "Self-hosted hub management, web remote and local API for Sofabaton X1 / X1S / X2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "m3tac0de" }]
keywords = ["sofabaton", "x1", "x1s", "x2", "universal-remote", "rest", "websocket", "openapi", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "sofabaton-x>=0.2.1,<0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "websockets>=12"]

[project.urls]
Homepage = "https://github.com/m3tac0de/home-assistant-sofabaton-x1s/tree/main/sofabaton-x-server"
Issues = "https://github.com/m3tac0de/home-assistant-sofabaton-x1s/issues"
Changelog = "https://github.com/m3tac0de/home-assistant-sofabaton-x1s/blob/main/sofabaton-x-server/CHANGELOG.md"

[project.scripts]
sofabaton-x-server = "sofabaton_server.cli:main"

[tool.hatch.version]
path = "src/sofabaton_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sofabaton_server"]
