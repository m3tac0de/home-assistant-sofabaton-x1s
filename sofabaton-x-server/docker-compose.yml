# sofabaton-x-server with Docker Compose, from the published image.
#
# This deployment uses Linux host networking: the app finds the proxy over mDNS
# and (iOS) UDP broadcast, and the hub dials back to TCP 8200 on this host.
# A bridge network needs additional routing/discovery configuration.
# Docker Desktop has opt-in host networking in recent versions, but this
# project's multicast and hub dial-back compatibility there is unverified.
# https://docs.docker.com/engine/network/drivers/host/
#
#   docker compose up -d
#   docker compose logs -f
#
# Upgrade: docker compose pull && docker compose up -d (the data directory
# is kept). Synology Container Manager shows "Update available" for this
# image because it comes from Docker Hub with the latest tag; see
# docs/running-server.md#docker.
#
# Fully close the official Sofabaton app first: connected hubs do not advertise.
# Then open http://<server>:8480/ and add hubs in the control panel.
# Set up access there to require credentials for configuration writes.
# Keep ./data: it also holds auth.json and, if set in the panel, mqtt.json
# with the broker password in plain text.
# SOFABATON_HUBS is an optional seed for first startup only.
services:
  sofabaton-x-server:
    image: m3tac0de/sofabaton-x-server:latest
    # To run your own build from a checkout instead of the published image,
    # replace the image line with (the context is the repository root):
    # build:
    #   context: ..
    #   dockerfile: sofabaton-x-server/Dockerfile
    # image: sofabaton-x-server:local
    container_name: sofabaton-x-server
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data:/data
      # Built-in TLS without a reverse proxy (an https dashboard can only
      # embed an https web remote): mount the certificate directory and
      # name the files below. Renewed files are picked up within a minute,
      # no restart. See docs/running-server.md#tls-without-a-proxy.
      # - /path/to/certs:/ssl:ro
    environment:
      SOFABATON_PORT: "8480"
      # SOFABATON_TLS_CERT: "/ssl/fullchain.pem"
      # SOFABATON_TLS_KEY: "/ssl/privkey.pem"
      # SOFABATON_HUBS: "192.168.1.50,192.168.1.51"
      # SOFABATON_ADVERTISE_URL: "https://sofabaton.home.example"
      # SOFABATON_TRUSTED_PROXIES: "127.0.0.1"
      # SOFABATON_ALLOWED_ORIGINS: "http://nas:8123"  # only for browser pages calling the API directly
      # SOFABATON_BIND: "127.0.0.1"      # when a reverse proxy on this host fronts it
      SOFABATON_LOG_LEVEL: "info"
      # X2 only: use the same MQTT broker as the Sofabaton app. Configure it in
      # Server settings > MQTT broker, or here (startup settings override the panel).
      # Never put mqtt_* keys in server.json. Mount the password file if using it.
      # SOFABATON_MQTT_HOST: "192.168.1.20"
      # SOFABATON_MQTT_USERNAME: "sofabaton"
      # SOFABATON_MQTT_PASSWORD_FILE: "/run/secrets/mqtt_password"
