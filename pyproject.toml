# Packaging metadata for the standalone "sofabaton-x" library.
#
# The library's source of truth is custom_components/sofabaton_x1s/lib;
# at build time hatchling remaps that directory into the wheel as the
# top-level package "sofabaton" (see docs/internal/sofabaton-x_library_plan.md).
# The Home Assistant integration itself is NOT part of this distribution.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sofabaton-x"
dynamic = ["version"]
description = "Unofficial protocol library and man-in-the-middle proxy for Sofabaton X1 / X1S / X2 universal remote hubs"
readme = "sofabaton-x/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "m3tac0de" }]
keywords = ["sofabaton", "x1", "x1s", "x2", "universal-remote", "proxy", "mdns", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "zeroconf>=0.131",
    "ifaddr>=0.2",
]

[project.urls]
Homepage = "https://github.com/m3tac0de/home-assistant-sofabaton-x1s/tree/main/sofabaton-x"
Issues = "https://github.com/m3tac0de/home-assistant-sofabaton-x1s/issues"
Changelog = "https://github.com/m3tac0de/home-assistant-sofabaton-x1s/blob/main/sofabaton-x/CHANGELOG.md"
# The published package is built from the in-tree library directory
# (remapped to top-level "sofabaton" at build time), which isn't obvious
# from the repo layout — link it directly.
Source = "https://github.com/m3tac0de/home-assistant-sofabaton-x1s/tree/main/custom_components/sofabaton_x1s/lib"

[project.scripts]
sofabaton = "sofabaton.cli:main"

[tool.hatch.version]
path = "custom_components/sofabaton_x1s/lib/version.py"

[tool.hatch.build.targets.wheel]
# The in-tree package directory ships as top-level "sofabaton". A sources
# remap (not force-include) so the normal file selection applies: ignored
# files such as a local version.py.bak or __pycache__ never ship (CR-R1-14).
packages = ["custom_components/sofabaton_x1s/lib"]

[tool.hatch.build.targets.wheel.sources]
"custom_components/sofabaton_x1s/lib" = "sofabaton"

[tool.hatch.build.targets.sdist]
include = [
    "custom_components/sofabaton_x1s/lib/**",
    "sofabaton-x/README.md",
    "sofabaton-x/CHANGELOG.md",
    "sofabaton-x/examples/**",
    "LICENSE",
]

# Code review program (docs/internal/code-review-plan.md, R0): report-only
# static analysis. Not a CI gate yet; see the plan's section 13.
[tool.ruff]
target-version = "py311"
extend-exclude = [
    "IrScrutinizer", "scripts/hub-bench", "node_modules", "dist", "dist-bench",
    "out", "artifacts", "test-results", ".venv*",
]

# The CI gate (R7, .github/workflows/python-lint.yml): rules that flag code
# that is almost always wrong. The review's wider report adds style and
# complexity rules and never gates:
#   ruff check --extend-select BLE,S110,C901,PLR0912,PLR0915,SIM --exit-zero .
[tool.ruff.lint]
select = ["F", "E9", "PLE", "B", "ASYNC", "RUF006"]
# ASYNC109 asks for asyncio.timeout() instead of a `timeout` parameter: an
# API style, and the facade's public methods take `timeout` by design.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Command-line tools own their event loop: a blocking open() or a polling
# sleep there stalls nothing else.
"custom_components/sofabaton_x1s/lib/cli.py" = ["ASYNC230"]
"sofabaton-x/examples/*.py" = ["ASYNC110", "ASYNC230"]
# Tests poll for a condition with short sleeps, and start helper tasks that
# live only within the test's own awaits.
"tests/**" = ["ASYNC110", "RUF006"]
"sofabaton-x-server/tests/**" = ["RUF006"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters through calls in the defaults.
extend-immutable-calls = ["fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Depends"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pyright]
include = [
    "custom_components/sofabaton_x1s/lib",
    "sofabaton-x-server/src",
]
typeCheckingMode = "basic"
# The mixins subclass _ProxyHost for the type checker (CR-L3a-17): these
# make a drifted member an error at its definition.
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
pythonVersion = "3.11"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv-py313"
